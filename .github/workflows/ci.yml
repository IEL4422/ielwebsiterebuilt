name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Homepage resilience tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # vitest is installed with --no-save on purpose. Adding it to
      # package.json would desynchronise package-lock.json, and Railway's build
      # runs `npm ci`, which fails on a lockfile that does not match. The test
      # tooling must not be able to break the production build.
      - name: Install test runner
        run: npm install --no-save --no-audit --no-fund vitest@1.6.1

      - name: Run tests
        run: npx vitest run

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        run: npm run typecheck

  production-build:
    name: Production build including generated pricing sheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- public/pricing-sheet.html

      # Preserve the production Node 18 build above; current browser tooling
      # needs Node 20 only for the read-only layout verification below.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser regression tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify responsive production header
        run: |
          PORT=3192 npm start > /tmp/header-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3192/flat-fee-vs-hourly-probate-illinois/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-header-layout.cjs
